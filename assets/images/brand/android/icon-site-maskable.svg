<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Linear Gradient (REVERSED): Mint Green to Violet -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="30%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    
    <!-- Circle Linear Gradient (Signature Brand): Violet to Mint Green -->
    <linearGradient id="circle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="30%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Spherical Light Overlay (Glow top-left, shadow bottom-right) -->
    <radialGradient id="sphere-light" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </radialGradient>

    <!-- Soft Drop Shadow Filter for 3D depth -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Layer 1: Background Square -->
  <rect width="100" height="100" fill="url(#bg-grad)"/>
  
  <!-- Scale and translate core artwork to fit safely within Android's 66% circular safe zone -->
  <g transform="translate(15, 15) scale(0.7)">
    <!-- Layer 2: Central Circle (Signature Violet to Mint with soft drop-shadow) -->
    <circle cx="50" cy="50" r="44" fill="url(#circle-grad)" filter="url(#soft-shadow)"/>
    
    <!-- Layer 3: Spherical Light Overlay on Circle -->
    <circle cx="50" cy="50" r="44" fill="url(#sphere-light)"/>
    
    <!-- Layer 4: FF Logo Mark -->
    <path d="M22.5,32 H30.5 V68 H22.5 Z M28.6,47 H46.6 V53.9 H28.6 Z M28.6,32 H47.4 V38.9 H28.6 Z M52.6,32 H60.6 V68 H52.6 Z M58.7,47 H76.7 V53.9 H58.7 Z M58.7,32 H77.5 V38.9 H58.7 Z" fill="#ffffff"/>
  </g>
</svg>
