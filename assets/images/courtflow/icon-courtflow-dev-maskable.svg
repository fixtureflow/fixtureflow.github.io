<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Linear Gradient: Sky Blue to Mint Green -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    
    <!-- Circle Gradient (Reversed): Mint Green to Sky Blue -->
    <linearGradient id="circle-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>

    <!-- Spherical Light Overlay (Mint glow top-left, Blue shadow bottom-right) -->
    <radialGradient id="sphere-light" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </radialGradient>
    
    <!-- Fading Glass Sheen Gradient -->
    <linearGradient id="sheen-grad" x1="70%" y1="0%" x2="20%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter for 3D depth -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Layer 1: Background Square -->
  <rect width="100" height="100" fill="url(#bg-grad)"/>
  
  <!-- Scale and translate core artwork to fit safely within Android 66% circular safe zone -->
  <g transform="translate(15, 15) scale(0.7)">
    <!-- Layer 2: Central Circle (With soft drop-shadow) -->
      <circle cx="50" cy="50" r="44" fill="url(#circle-grad)" filter="url(#soft-shadow)"/>
      
      <!-- Layer 3: Spherical Light Overlay on Circle -->
      <circle cx="50" cy="50" r="44" fill="url(#sphere-light)"/>
      
      <!-- Layer 4: FF Logo Mark -->
      <path d="M22.5,32 H30.5 V68 H22.5 Z M28.6,47 H46.6 V53.9 H28.6 Z M28.6,32 H47.4 V38.9 H28.6 Z M52.6,32 H60.6 V68 H52.6 Z M58.7,47 H76.7 V53.9 H58.7 Z M58.7,32 H77.5 V38.9 H58.7 Z" fill="#ffffff"/>
    
      <!-- Layer 6: DEV Environment Pill Badge -->
      <g filter="url(#soft-shadow)">
        <rect x="48" y="73" width="46" height="21" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1.8"/>
        <path fill="#fbbf24" fill-rule="evenodd" d="M 55.5,78.5 H 60 C 62.2,78.5 63.8,80 63.8,83.5 C 63.8,87 62.2,88.5 60,88.5 H 55.5 Z M 57.7,80.5 V 86.5 H 59.8 C 60.8,86.5 61.5,85.6 61.5,83.5 C 61.5,81.4 60.8,80.5 59.8,80.5 Z M 66.8,78.5 H 73.3 V 80.5 H 69 V 82.5 H 72.6 V 84.5 H 69 V 86.5 H 73.3 V 88.5 H 66.8 Z M 75.8,78.5 H 78.1 L 79.8,85.3 L 81.5,78.5 H 83.8 L 80.9,88.5 H 78.7 Z"/>
      </g>
  </g>

  <!-- Layer 5: Diagonal Glass Sheen Path (Full Bleed) -->
  <path d="M 0,0 L 0,100 L 30,100 L 70,0 Z" fill="url(#sheen-grad)" pointer-events="none"/>
</svg>
