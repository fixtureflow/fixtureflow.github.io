<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourtFlow - Racket Sports Social Session Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --text-color: #f3f4f6;
            --primary-color: #10b981; /* Emerald green for CourtFlow */
            --accent-color: #3b82f6;
            --card-bg: rgba(17, 24, 39, 0.7);
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: auto;
            padding: 3rem 2rem;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .logo {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
            letter-spacing: -1px;
        }
        .subtitle {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 600;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }
        p {
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            font-size: 1.05rem;
        }
        .badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn {
            display: inline-block;
            padding: 0.75rem 1.75rem;
            background: var(--primary-color);
            color: #0b0f19;
            text-decoration: none;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">Under Construction</div>
        <div class="logo">CourtFlow</div>
        <div class="subtitle">By FixtureFlow</div>
        <h1>Social Play & Court Queue Autopilot</h1>
        <p>
            Tired of running busy club nights with whiteboards, pegs, and constant complaints? CourtFlow automatically manages your queue, pairs players by skill, and ensures fair rotation on autopilot.
        </p>
        <a href="../" class="btn">Back to FixtureFlow</a>
    </div>
</body>
</html>
