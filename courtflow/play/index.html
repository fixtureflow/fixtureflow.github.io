<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>CourtFlow Portal</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/icon-courtflow.svg">
  <link rel="apple-touch-icon" href="/assets/images/icon-courtflow.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1329">
  <style>
    :root {
      --bg-color: #0b1329;
      --bg-gradient: radial-gradient(circle at center, #111827 0%, #0b1329 100%);
      --text-color: #ffffff;
      --muted-text: #94a3b8;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --loader-bg: rgba(255, 255, 255, 0.08);
      --glow-color: rgba(16, 185, 129, 0.08);
    }

    /* System preference light mode fallback */
    @media (prefers-color-scheme: light) {
      :root {
        --bg-color: #f8fafc;
        --bg-gradient: radial-gradient(circle at center, #ffffff 0%, #f1f5f9 100%);
        --text-color: #0f172a;
        --muted-text: #64748b;
        --card-bg: rgba(15, 23, 42, 0.03);
        --card-border: rgba(15, 23, 42, 0.08);
        --loader-bg: rgba(15, 23, 42, 0.08);
        --glow-color: rgba(16, 185, 129, 0.04);
      }
    }

    /* Explicit theme overrides */
    body.theme-dark {
      --bg-color: #0b1329;
      --bg-gradient: radial-gradient(circle at center, #111827 0%, #0b1329 100%);
      --text-color: #ffffff;
      --muted-text: #94a3b8;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --loader-bg: rgba(255, 255, 255, 0.08);
      --glow-color: rgba(16, 185, 129, 0.08);
    }

    body.theme-light {
      --bg-color: #f8fafc;
      --bg-gradient: radial-gradient(circle at center, #ffffff 0%, #f1f5f9 100%);
      --text-color: #0f172a;
      --muted-text: #64748b;
      --card-bg: rgba(15, 23, 42, 0.03);
      --card-border: rgba(15, 23, 42, 0.08);
      --loader-bg: rgba(15, 23, 42, 0.08);
      --glow-color: rgba(16, 185, 129, 0.04);
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-color);
    }
    
    iframe {
      width: 100%;
      height: 100dvh;
      border: none;
      display: none;
    }

    .screen-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100dvh;
      box-sizing: border-box;
      padding: 24px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      background: var(--bg-gradient);
    }

    .glow-backdrop {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, var(--glow-color) 0%, rgba(16, 185, 129, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--loader-bg);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      z-index: 2;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: spin 3s linear infinite;
      }
    }

    .loading-text {
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.08em;
      margin-top: 16px;
      color: var(--muted-text);
      z-index: 2;
    }

    .offline-card {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      z-index: 2;
    }

    .offline-icon {
      font-size: 40px;
      margin-bottom: 16px;
    }

    .offline-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 8px 0;
      color: var(--text-color);
    }

    .offline-desc {
      font-size: 14px;
      color: var(--muted-text);
      line-height: 1.5;
      margin: 0 0 24px 0;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      padding: 0 24px;
      background: #10b981;
      border: none;
      border-radius: 8px;
      color: #0b1329;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      transition: background-color 0.2s ease, transform 0.1s ease;
      touch-action: manipulation;
    }

    .retry-btn:hover {
      background: #34d399;
    }

    .retry-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="screen-overlay" id="status-screen">
    <div class="glow-backdrop"></div>
    
    <div class="spinner" id="spinner-loader"></div>
    <div class="loading-text" id="status-text">CONNECTING TO PORTAL...</div>

    <div class="offline-card" id="offline-panel">
      <div class="offline-icon">📶</div>
      <h2 class="offline-title">Connection Lost</h2>
      <p class="offline-desc">We couldn't connect to the CourtFlow scheduling portal. Please check your network connection.</p>
      <button class="retry-btn" onclick="tryReload()">RETRY CONNECTION</button>
    </div>
  </div>

  <iframe id="app-frame" src=""></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker registered'))
        .catch(err => console.error('SW failed: ', err));
    }

    const frame = document.getElementById('app-frame');
    const statusScreen = document.getElementById('status-screen');
    const statusText = document.getElementById('status-text');
    const spinnerLoader = document.getElementById('spinner-loader');
    const offlinePanel = document.getElementById('offline-panel');

    const urlParams = new URLSearchParams(window.location.search);
    let hostId = urlParams.get('h');
    let roleView = urlParams.get('view');

    if (hostId) {
      localStorage.setItem('pwa_host_id', hostId);
      if (roleView) {
        localStorage.setItem('pwa_role_view', roleView);
      } else {
        localStorage.removeItem('pwa_role_view');
      }
    } else {
      hostId = localStorage.getItem('pwa_host_id');
      roleView = localStorage.getItem('pwa_role_view');
    }

    // Initialize Theme State
    function applySavedTheme() {
      const savedTheme = localStorage.getItem('pwa_theme');
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.body.classList.add(`theme-${savedTheme}`);
        updateThemeColor(savedTheme);
      } else {
        const isSystemLight = window.matchMedia('(prefers-color-scheme: light)').matches;
        updateThemeColor(isSystemLight ? 'light' : 'dark');
      }
    }

    function updateThemeColor(theme) {
      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme) {
        metaTheme.setAttribute('content', theme === 'light' ? '#f8fafc' : '#0b1329');
      }
    }

    // Listen for postMessage updates from GAS app
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'THEME_CHANGE') {
        const newTheme = event.data.theme;
        if (newTheme === 'light' || newTheme === 'dark') {
          localStorage.setItem('pwa_theme', newTheme);
          document.body.classList.remove('theme-light', 'theme-dark');
          document.body.classList.add(`theme-${newTheme}`);
          updateThemeColor(newTheme);
        }
      }
    });

    function initApp() {
      if (!hostId) {
        showError('CONFIG ERROR: Missing host ID parameter (?h=...)');
        return;
      }

      if (!navigator.onLine) {
        showOfflineState();
        return;
      }

      offlinePanel.style.display = 'none';
      spinnerLoader.style.display = 'block';
      statusText.textContent = 'CONNECTING TO PORTAL...';
      statusScreen.style.display = 'flex';

      let targetUrl = `https://script.google.com/macros/s/${hostId}/exec`;
      if (roleView) {
        targetUrl += `?view=${roleView}`;
      }
      
      frame.src = targetUrl;

      frame.onload = () => {
        statusScreen.style.display = 'none';
        frame.style.display = 'block';
      };
    }

    function showOfflineState() {
      spinnerLoader.style.display = 'none';
      statusText.textContent = '';
      offlinePanel.style.display = 'flex';
      statusScreen.style.display = 'flex';
      frame.style.display = 'none';
    }

    function showError(message) {
      spinnerLoader.style.display = 'none';
      statusText.innerHTML = `<span style="color: #ef4444; font-weight: 600;">${message}</span>`;
      statusScreen.style.display = 'flex';
      frame.style.display = 'none';
    }

    function tryReload() {
      initApp();
    }

    window.addEventListener('online', () => {
      console.log('Device returned online. Connecting...');
      initApp();
    });

    window.addEventListener('offline', () => {
      console.log('Device went offline.');
      showOfflineState();
    });

    // Run theme setup and initialize
    applySavedTheme();
    initApp();
  </script>
</body>
</html>
