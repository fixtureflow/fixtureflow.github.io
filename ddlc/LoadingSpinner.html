<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
 body {
   display: flex;
   justify-content: center;
   align-items: center;
   height: 100vh;
   margin: 0;
   font-family: Arial, sans-serif;
   color: #444;
   text-align: center; /* Center the text */
 }
 .spinner {
   border: 4px solid #f3f3f3;
   border-top: 4px solid #3498db;
   border-radius: 50%;
   width: 30px;
   height: 30px;
   animation: spin 1.2s linear infinite;
   margin: 0 auto 15px auto; /* Center the spinner itself */
 }
 @keyframes spin {
   0% { transform: rotate(0deg); }
   100% { transform: rotate(360deg); }
 }
</style>
</head>
<body>
 <div>
   <div class="spinner"></div>
   <p>Please wait...</p>
 </div>
</body>
</html>
