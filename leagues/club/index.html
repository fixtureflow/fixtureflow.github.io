<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>FixtureFlow | Club Admin</title>
  <link rel="icon" type="image/svg+xml" href="/assets/images/icon-club.svg">
  <link rel="apple-touch-icon" href="/assets/images/icon-club.svg">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1329">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b1329;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }
    
    iframe {
      width: 100%;
      height: 100dvh;
      border: none;
      display: none;
    }

    .screen-overlay {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100dvh;
      box-sizing: border-box;
      padding: 24px;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
      background: radial-gradient(circle at center, #111827 0%, #0b1329 100%);
    }

    .glow-backdrop {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(71, 85, 105, 0.08) 0%, rgba(71, 85, 105, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.08);
      border-top-color: #94a3b8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      z-index: 2;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: spin 3s linear infinite;
      }
    }

    .loading-text {
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.08em;
      margin-top: 16px;
      color: #94a3b8;
      z-index: 2;
    }

    .offline-card {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      z-index: 2;
    }

    .offline-icon {
      font-size: 40px;
      margin-bottom: 16px;
    }

    .offline-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 8px 0;
      color: #ffffff;
    }

    .offline-desc {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      padding: 0 24px;
      background: #475569;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      width: 100%;
      box-sizing: border-box;
      transition: background-color 0.2s ease, transform 0.1s ease;
      touch-action: manipulation;
    }

    .retry-btn:hover {
      background: #64748b;
    }

    .retry-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="screen-overlay" id="status-screen">
    <div class="glow-backdrop"></div>
    
    <div class="spinner" id="spinner-loader"></div>
    <div class="loading-text" id="status-text">CONNECTING TO PORTAL...</div>

    <div class="offline-card" id="offline-panel">
      <div class="offline-icon">📶</div>
      <h2 class="offline-title">Connection Lost</h2>
      <p class="offline-desc">We couldn't connect to the Leagues Club Admin portal. Please check your network connection.</p>
      <button class="retry-btn" onclick="tryReload()">RETRY CONNECTION</button>
    </div>
  </div>

  <iframe id="app-frame" src=""></iframe>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker registered'))
        .catch(err => console.error('SW failed: ', err));
    }

    const frame = document.getElementById('app-frame');
    const statusScreen = document.getElementById('status-screen');
    const statusText = document.getElementById('status-text');
    const spinnerLoader = document.getElementById('spinner-loader');
    const offlinePanel = document.getElementById('offline-panel');

    const urlParams = new URLSearchParams(window.location.search);
    let hostId = urlParams.get('h');
    let roleView = urlParams.get('view');

    if (hostId) {
      localStorage.setItem('pwa_host_id', hostId);
      if (roleView) {
        localStorage.setItem('pwa_role_view', roleView);
      } else {
        localStorage.removeItem('pwa_role_view');
      }
    } else {
      hostId = localStorage.getItem('pwa_host_id');
      roleView = localStorage.getItem('pwa_role_view');
    }

    function initApp() {
      if (!hostId) {
        showError('CONFIG ERROR: Missing host ID parameter (?h=...)');
        return;
      }

      if (!navigator.onLine) {
        showOfflineState();
        return;
      }

      offlinePanel.style.display = 'none';
      spinnerLoader.style.display = 'block';
      statusText.textContent = 'CONNECTING TO PORTAL...';
      statusScreen.style.display = 'flex';

      let targetUrl = `https://script.google.com/macros/s/${hostId}/exec`;
      if (roleView) {
        targetUrl += `?view=${roleView}`;
      }
      
      frame.src = targetUrl;

      frame.onload = () => {
        statusScreen.style.display = 'none';
        frame.style.display = 'block';
      };
    }

    function showOfflineState() {
      spinnerLoader.style.display = 'none';
      statusText.textContent = '';
      offlinePanel.style.display = 'flex';
      statusScreen.style.display = 'flex';
      frame.style.display = 'none';
    }

    function showError(message) {
      spinnerLoader.style.display = 'none';
      statusText.innerHTML = `<span style="color: #ef4444; font-weight: 600;">${message}</span>`;
      statusScreen.style.display = 'flex';
      frame.style.display = 'none';
    }

    function tryReload() {
      initApp();
    }

    window.addEventListener('online', () => {
      console.log('Device returned online. Connecting...');
      initApp();
    });

    window.addEventListener('offline', () => {
      console.log('Device went offline.');
      showOfflineState();
    });

    initApp();
  </script>
</body>
</html>
