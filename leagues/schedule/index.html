            <div class="match-teams">
              ${escapeHtml(match.ourTeam)} <span style="opacity:0.5; font-size:0.8em; font-weight:400;">vs</span> ${escapeHtml(match.opponent)}
            </div>
            <div class="match-details">
              <span class="badge ${badgeClass}">${roleLabel}</span>
              <span class="badge match-type">${escapeHtml(compLabel)}</span>
            </div>
          </div>
          <div class="match-right-col">
            <button type="button" onclick="downloadSingleMatchIcs(${idx})" style="background: var(--bg); border: 1px solid var(--border); color: var(--on-surface); border-radius: 8px; padding: 8px 10px; font-size: 0.75rem; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; cursor: pointer;" title="Add match to Calendar (.ics)">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
                <line x1="12" y1="14" x2="12" y2="18"></line>
                <line x1="10" y1="16" x2="14" y2="16"></line>
              </svg>
              <span>+Cal</span>
            </button>
          </div>
        </div>
        <div class="match-venue" title="${escapeHtml(venueStr)}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
            <circle cx="12" cy="10" r="3"></circle>
          </svg>
          <span class="venue-text-clamp">${escapeHtml(venueStr)}</span>
        </div>
      </div>
    `;
  }

  // --- TAB 1: UPCOMING MATCHES LIST RENDERER ---
  function renderMatches() {
    const container = document.getElementById('matches-list-container');
    if (!container) return;
    const allFixtures = (appData && Array.isArray(appData.fixtures)) ? appData.fixtures : [];
    const filtered = getFilteredFixtures(true);

    if (filtered.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding: 40px 16px; opacity: 0.65;">No upcoming confirmed matches found for the current filter.</div>`;
      return;
    }

    const cardsHtml = filtered.map(m => {
      const globalIdx = allFixtures.indexOf(m);
      return buildMatchCardHtml(m, globalIdx);
    }).join('');

    container.innerHTML = cardsHtml;
  }

  // --- TAB 2: MULTI-MONTH SEASON CALENDAR RENDERER ---
  function getActiveCalendarMonthIndex_(container, monthEls) {
    if (!monthEls.length) return 0;
    const scrollLeft = container.scrollLeft;
    let bestIdx = 0;
    let bestDist = Infinity;
    monthEls.forEach((el, idx) => {
      const dist = Math.abs(el.offsetLeft - scrollLeft);
      if (dist < bestDist) {
        bestDist = dist;
        bestIdx = idx;
      }
    });
    return bestIdx;
  }

  function updateCalendarScrollButtons_() {
    const container = document.getElementById('season-grid-container');
    const prevBtn = document.getElementById('cal-scroll-prev');
    const nextBtn = document.getElementById('cal-scroll-next');
    if (!container || !prevBtn || !nextBtn) return;
    const monthEls = Array.from(container.querySelectorAll('.month-grid'));
    if (monthEls.length <= 1) {
      prevBtn.disabled = true;
      nextBtn.disabled = true;
      return;
    }
    const idx = getActiveCalendarMonthIndex_(container, monthEls);
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx >= monthEls.length - 1;
  }

  function scrollScheduleMonth(delta) {
    const container = document.getElementById('season-grid-container');
    if (!container) return;
    const monthEls = Array.from(container.querySelectorAll('.month-grid'));
    if (!monthEls.length) return;
    const currentIdx = getActiveCalendarMonthIndex_(container, monthEls);
    const targetIdx = Math.max(0, Math.min(monthEls.length - 1, currentIdx + delta));
    const targetEl = monthEls[targetIdx];
    if (targetEl) {
      container.scrollTo({ left: targetEl.offsetLeft, behavior: 'smooth' });
    }
  }

  function renderCalendarGrid(opts = {}) {
    const container = document.getElementById('season-grid-container');
    if (!container) return;
    const preserveScroll = Boolean(opts && opts.preserveScroll);
    const prevScrollLeft = container.scrollLeft;
    container.innerHTML = '';

    if (!container._hasScrollListener) {
      container.addEventListener('scroll', updateCalendarScrollButtons_, { passive: true });
      container._hasScrollListener = true;
    }

    const filtered = getFilteredFixtures(false);
    const byDate = {};
    filtered.forEach(m => {
      if (!byDate[m.date]) byDate[m.date] = [];
      byDate[m.date].push(m);
    });

    const months = (appData && Array.isArray(appData.seasonMonths) && appData.seasonMonths.length > 0)
      ? appData.seasonMonths
      : Object.keys(byDate).map(d => d.slice(0, 7)).filter((v, i, a) => a.indexOf(v) === i).sort();

    if (!selectedCalendarDate || !byDate[selectedCalendarDate]) {
      const todayIso = (appData && appData.serverToday) ? String(appData.serverToday) : '';
      const sortedDates = Object.keys(byDate).sort();
      const firstUpcoming = sortedDates.find(d => d >= todayIso);
      selectedCalendarDate = firstUpcoming || sortedDates[0] || null;
    }

    months.forEach(ym => {
      const parts = String(ym).split('-');
      if (parts.length !== 2) return;
      const year = parseInt(parts[0], 10);
      const month = parseInt(parts[1], 10) - 1;
      if (isNaN(year) || isNaN(month)) return;

      const div = document.createElement('div');
      div.className = 'month-grid';
      div.setAttribute('data-ym', ym);

      const header = document.createElement('div');
      header.className = 'month-header-title';
      header.textContent = new Date(year, month, 1).toLocaleString('en-IE', { month: 'long', year: 'numeric' });
      div.appendChild(header);

      const dowRow = document.createElement('div');
      dowRow.className = 'dow-row';
      ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(d => {
        const dDiv = document.createElement('div');
        dDiv.textContent = d;
        dowRow.appendChild(dDiv);
      });
      div.appendChild(dowRow);

      const daysGrid = document.createElement('div');
      daysGrid.className = 'days-grid';

      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement('div');
        empty.className = 'day-cell empty';
        daysGrid.appendChild(empty);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const cell = document.createElement('div');
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayMatches = byDate[dateStr] || [];
        const homeCount = dayMatches.filter(m => isHostClubHome(m)).length;
        const awayCount = dayMatches.length - homeCount;

        cell.className = 'day-cell ' + (dayMatches.length > 0 ? 'has-matches' : 'no-matches');
        if (selectedCalendarDate === dateStr) {
          cell.classList.add('selected');
        }

        let indicatorHtml = '';
        if (dayMatches.length > 0 && dayMatches.length <= 3) {
          const dots = [];
          for (let h = 0; h < homeCount; h++) dots.push('<span class="day-dot home"></span>');
          for (let a = 0; a < awayCount; a++) dots.push('<span class="day-dot away"></span>');
          indicatorHtml = `<div class="day-indicators">${dots.join('')}</div>`;
        } else if (dayMatches.length >= 4) {
          const pips = [];
          if (homeCount > 0) pips.push(`<span class="day-pip home"><span class="day-dot home"></span>${homeCount}</span>`);
          if (awayCount > 0) pips.push(`<span class="day-pip away"><span class="day-dot away"></span>${awayCount}</span>`);
          indicatorHtml = `<div class="day-indicators">${pips.join('')}</div>`;
        } else {
          indicatorHtml = `<div class="day-indicators"></div>`;
        }

        cell.innerHTML = `<span style="line-height:1;">${d}</span>${indicatorHtml}`;
        cell.onclick = () => {
          selectedCalendarDate = dateStr;
          renderCalendarGrid({ preserveScroll: true });
          renderSelectedDayPanel();
        };

        daysGrid.appendChild(cell);
      }

      div.appendChild(daysGrid);
      container.appendChild(div);
    });

    if (preserveScroll) {
      container.scrollLeft = prevScrollLeft;
    } else if (selectedCalendarDate) {
      const targetYm = selectedCalendarDate.slice(0, 7);
      const targetMonthEl = container.querySelector(`.month-grid[data-ym="${targetYm}"]`);
      if (targetMonthEl) {
        container.scrollLeft = targetMonthEl.offsetLeft;
      }
    }

    updateCalendarScrollButtons_();
    renderSelectedDayPanel();
  }

  function renderSelectedDayPanel() {
    const panel = document.getElementById('selected-day-content');
    if (!panel) return;

    const allFixtures = (appData && Array.isArray(appData.fixtures)) ? appData.fixtures : [];
    const filtered = getFilteredFixtures(false);
    const dayMatches = selectedCalendarDate ? filtered.filter(m => m.date === selectedCalendarDate) : [];

    if (!selectedCalendarDate) {
      panel.innerHTML = `<div style="text-align:center; padding: 24px 8px; color: var(--text-muted); font-size: 0.85rem;">Tap any highlighted date in the calendar to view confirmed matches.</div>`;
      return;
    }

    const parts = selectedCalendarDate.split('-');
    const dObj = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
    const dateLabel = dObj.toLocaleDateString('en-IE', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
    const homeCount = dayMatches.filter(m => isHostClubHome(m)).length;

    let html = `
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 12px;">
        <div>
          <h3 style="margin: 0; font-size: 1.05rem; color: var(--on-surface);">${escapeHtml(dateLabel)}</h3>
          <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 2px;">${dayMatches.length} Confirmed ${dayMatches.length === 1 ? 'Match' : 'Matches'}</div>
        </div>
        ${homeCount > 0 ? `<span class="badge home">${homeCount} Home</span>` : ''}
      </div>
    `;

    if (dayMatches.length === 0) {
      html += `<div style="text-align: center; padding: 24px 8px; color: var(--text-muted); font-size: 0.85rem;">No confirmed matches on this date for the current filter.</div>`;
    } else {
      html += dayMatches.map(m => buildMatchCardHtml(m, allFixtures.indexOf(m))).join('');
    }
    panel.innerHTML = html;
  }

  // --- UI SYNCHRONIZATION ---
  function syncScheduleUI() {
    const dText = document.getElementById('desktop-team-select-text');
    const mText = document.getElementById('mobile-team-select-text');
    if (dText) dText.textContent = selectedTeam === 'ALL' ? 'TEAM: ALL TEAMS' : `TEAM: ${selectedTeam.toUpperCase()}`;
    if (mText) mText.textContent = selectedTeam === 'ALL' ? 'All' : selectedTeam;

    ['ALL', 'HOME', 'AWAY'].forEach(v => {
      const btn = document.getElementById('venue-' + v);
      if (btn) btn.classList.toggle('active', venueFilter === v);
    });
    ['ALL', 'LEAGUE', 'CUP'].forEach(c => {
      const btn = document.getElementById('comp-' + c);
      if (btn) btn.classList.toggle('active', compFilter === c);
    });

    const upcomingCount = getFilteredFixtures(true).length;
    const exportTxt = document.getElementById('desktop-export-ics-text');
    if (exportTxt) exportTxt.textContent = `Export .ics (${upcomingCount})`;

    const isFiltered = selectedTeam !== 'ALL' || venueFilter !== 'ALL' || compFilter !== 'ALL';
    const filterBar = document.getElementById('active-filter-bar');
    const filterText = document.getElementById('active-filter-text');
    if (filterBar && filterText) {
      if (isFiltered) {
        const parts = [];
        if (selectedTeam !== 'ALL') parts.push(selectedTeam);
        if (venueFilter !== 'ALL') parts.push(venueFilter === 'HOME' ? 'Home' : 'Away');
        if (compFilter !== 'ALL') parts.push(compFilter === 'LEAGUE' ? 'League' : 'Cup');
        filterText.textContent = `Showing ${upcomingCount} upcoming ${upcomingCount === 1 ? 'match' : 'matches'} (${parts.join(' • ')})`;
        filterBar.classList.remove('hidden');
      } else {
        filterBar.classList.add('hidden');
      }
    }

    renderMatches();
    renderCalendarGrid();
    switchScheduleTab(activeTab, true);
  }

  function switchScheduleTab(tab, skipSave = false) {
    activeTab = tab;
    if (!skipSave) saveSchedulePrefs();
    const tabM = document.getElementById('tab-matches');
    const tabC = document.getElementById('tab-calendar');
    const navBtns = document.querySelectorAll('#bottom-nav .nav-item');

    if (tabM && tabC) {
      if (tab === 'matches') {
        tabM.classList.remove('hidden');
        tabC.classList.add('hidden');
        if (navBtns[0]) navBtns[0].classList.add('active');
        if (navBtns[1]) navBtns[1].classList.remove('active');
      } else {
        tabM.classList.add('hidden');
        tabC.classList.remove('hidden');
        if (navBtns[0]) navBtns[0].classList.remove('active');
        if (navBtns[1]) navBtns[1].classList.add('active');
        renderCalendarGrid();
      }
    }
  }

  // --- RFC 5545 .ICS CALENDAR EXPORT ---
  function formatIcsDateTime_(dateStr, timeStr, durationMinutes = 120) {
    const parts = String(dateStr || '').split('-');
    const y = parseInt(parts[0], 10) || 2026;
    const m = (parseInt(parts[1], 10) || 1) - 1;
    const d = parseInt(parts[2], 10) || 1;

    let hh = 19;
    let mm = 30;
    const tMatch = String(timeStr || '').match(/(\d{1,2}):(\d{2})/);
    if (tMatch) {
      hh = parseInt(tMatch[1], 10);
      mm = parseInt(tMatch[2], 10);
    }

    const start = new Date(y, m, d, hh, mm, 0);
    const end = new Date(start.getTime() + durationMinutes * 60000);
    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (dt) =>
      `${dt.getFullYear()}${pad(dt.getMonth() + 1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`;

    return { dtStart: fmt(start), dtEnd: fmt(end) };
  }

  function escapeIcsText_(str) {
    return String(str || '')
      .replace(/\\/g, '\\\\')
      .replace(/;/g, '\\;')
      .replace(/,/g, '\\,')
      .replace(/\r?\n/g, '\\n');
  }

  function buildIcsContent_(matches) {
    const clubName = getHostClubName();
    const nowStamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//FixtureFlow//DDLC Match Schedule//EN',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH'
    ];

    matches.forEach((m, idx) => {
      const isHome = isHostClubHome(m);
      const roleLabel = isHome ? 'Home' : 'Away';
      const compLabel = m.leagueCup || 'League';
      const summary = `${clubName} ${m.ourTeam} vs ${m.opponent} (${roleLabel} - ${compLabel})`;
      const description = `${compLabel} Match (${roleLabel})\\nTeam: ${clubName} ${m.ourTeam}\\nOpponent: ${m.opponent}\\nVenue: ${m.venue || ''}`;
      const { dtStart, dtEnd } = formatIcsDateTime_(m.date, m.time, 120);
      const uid = `ff-${m.date}-${String(m.ourTeam).replace(/\s+/g, '')}-${idx}@fixtureflow`;

      lines.push(
        'BEGIN:VEVENT',
        `UID:${uid}`,
        `DTSTAMP:${nowStamp}`,
        `DTSTART:${dtStart}`,
        `DTEND:${dtEnd}`,
        `SUMMARY:${escapeIcsText_(summary)}`,
        `LOCATION:${escapeIcsText_(m.venue || '')}`,
        `DESCRIPTION:${description}`,
        'END:VEVENT'
      );
    });

    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }

  function triggerIcsDownload_(icsContent, filename) {
    const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.setAttribute('download', filename);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function downloadSingleMatchIcs(idx) {
    const all = (appData && Array.isArray(appData.fixtures)) ? appData.fixtures : [];
    const match = all[idx];
    if (!match) return;
    const ics = buildIcsContent_([match]);
    const safeTeam = String(match.ourTeam || 'match').replace(/[^a-zA-Z0-9_-]/g, '-');
    triggerIcsDownload_(ics, `${safeTeam}-${match.date}.ics`);
    showScheduleToast(`Added ${match.ourTeam} vs ${match.opponent} (${match.displayDate}) to Calendar (.ics)`);
  }

  function handleBulkExport() {
    const filtered = getFilteredFixtures(true);
    if (filtered.length === 0) {
      showScheduleToast('No upcoming matches to export for the current filter.');
      return;
    }
    const ics = buildIcsContent_(filtered);
    const safeTeam = selectedTeam === 'ALL' ? 'all-teams' : String(selectedTeam).toLowerCase().replace(/[^a-z0-9]+/g, '-');
    triggerIcsDownload_(ics, `match-schedule-${safeTeam}.ics`);
    showScheduleToast(`Exported ${filtered.length} confirmed ${filtered.length === 1 ? 'match' : 'matches'} to .ics calendar file`);
  }

  function showScheduleToast(msg) {
    const el = document.getElementById('toast-banner');
    if (!el) return;
    el.textContent = msg;
    el.classList.remove('hidden');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
  }

  // --- PULL-TO-REFRESH (#ptr-indicator) & LIVE SYNC ---
  let ptrStartY = 0;
  let ptrPulling = false;

  function initPullToRefresh_() {
    const ptrEl = document.getElementById('ptr-indicator');
    const ptrText = document.getElementById('ptr-text');
    if (!ptrEl || typeof window === 'undefined') return;

    window.addEventListener('touchstart', (e) => {
      if (window.scrollY <= 0 && e.touches && e.touches.length === 1) {
        ptrStartY = e.touches[0].clientY;
        ptrPulling = true;
      } else {
        ptrPulling = false;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!ptrPulling || !e.touches || e.touches.length !== 1) return;
      const deltaY = e.touches[0].clientY - ptrStartY;
      if (deltaY > 55 && window.scrollY <= 0) {
        ptrEl.classList.add('ptr-active');
        if (ptrText) ptrText.textContent = 'Release to refresh schedule...';
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      if (!ptrPulling) return;
      ptrPulling = false;
      if (ptrEl.classList.contains('ptr-active')) {
        if (ptrText) ptrText.textContent = 'Syncing live schedule...';
        fetchScheduleData({ isSilentRefresh: true });
      }
    }, { passive: true });
  }

  function showScheduleOfflineCard_() {
    const spinner = document.getElementById('spinner-loader');
    const statusTxt = document.getElementById('status-text');
    const offlinePanel = document.getElementById('offline-panel');
    const statusScreen = document.getElementById('status-screen');
    if (spinner) spinner.style.display = 'none';
    if (statusTxt) statusTxt.style.display = 'none';
    if (offlinePanel) offlinePanel.style.display = 'block';
    if (statusScreen) statusScreen.style.display = 'flex';
  }

  function renderScheduleDashboard_(dataObj) {
    appData = dataObj;
    window._lastScheduleFetchAt = Date.now();

    if (appData && appData.clubName && typeof updateClubBrandingState === 'function') {
      updateClubBrandingState(appData, 'Schedule');
    }

    // Validate persisted team against live team list
    if (selectedTeam !== 'ALL' && appData && Array.isArray(appData.teams)) {
      if (appData.teams.indexOf(selectedTeam) === -1) {
        selectedTeam = 'ALL';
      }
    }

    const statusScreen = document.getElementById('status-screen');
    if (statusScreen) statusScreen.style.display = 'none';
    const viewMain = document.getElementById('view-main');
    if (viewMain) viewMain.classList.remove('hidden');
    const bottomNav = document.getElementById('bottom-nav');
    if (bottomNav) bottomNav.classList.remove('hidden');

    syncScheduleUI();
  }

  function fetchScheduleData(opts = {}) {
    if (window._scheduleFetchInFlight) return;
    if (typeof google === 'undefined' || !google.script || !google.script.run || typeof google.script.run.getPublicMatchSchedule !== 'function') {
      return;
    }

    window._scheduleFetchInFlight = true;
    google.script.run
      .withSuccessHandler((res) => {
        window._scheduleFetchInFlight = false;
        const ptrEl = document.getElementById('ptr-indicator');
        if (ptrEl) ptrEl.classList.remove('ptr-active');

        const payload = (res && res.data) ? res.data : res;
        if (!payload || !Array.isArray(payload.fixtures)) {
          handleScheduleFetchFailure_('Invalid schedule response from server.');
          return;
        }

        if (typeof setPortalStorage === 'function') {
          setPortalStorage('schedule_cached_data', JSON.stringify(payload));
          setPortalStorage('shared_public_metadata', JSON.stringify({
            clubName: payload.clubName,
            clubLogoUrl: payload.clubLogoUrl,
            season: payload.season,
            seasonShort: payload.seasonShort
          }));
        }

        renderScheduleDashboard_(payload);
        if (opts.isSilentRefresh) {
          showScheduleToast('Schedule synced with live club sheet');
        }
      })
      .withFailureHandler((err) => {
        window._scheduleFetchInFlight = false;
        const ptrEl = document.getElementById('ptr-indicator');
        if (ptrEl) ptrEl.classList.remove('ptr-active');
        handleScheduleFetchFailure_(err && err.message ? err.message : String(err));
      })
      .getPublicMatchSchedule();
  }

  function handleScheduleFetchFailure_(errMsg) {
    console.warn('[Schedule Portal] Live fetch failed, checking offline fallback cache:', errMsg);
    // Strict Offline-Only Cache Fallback inside failure handler (Rule 7)
    const cachedRaw = (typeof getPortalStorage === 'function') ? getPortalStorage('schedule_cached_data') : null;
    if (cachedRaw) {
      try {
        const parsed = JSON.parse(cachedRaw);
        if (parsed && Array.isArray(parsed.fixtures)) {
          renderScheduleDashboard_(parsed);
          showScheduleToast('Offline mode: showing last saved schedule');
          return;
        }
      } catch (e) {}
    }
    showScheduleOfflineCard_();
  }

  if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && appData) {
        const elapsed = Date.now() - (window._lastScheduleFetchAt || 0);
        if (elapsed > 5000) {
          fetchScheduleData({ isSilentRefresh: false });
        }
      }
    });
  }

  // --- COLD BOOT INITIALIZATION (LIVE-FIRST SHEET SYNC) ---
  (function initScheduleBoot_() {
    loadSchedulePrefs();
    initPullToRefresh_();

    const cfgEl = document.getElementById('ff-config');
    const cfgClubName = cfgEl && cfgEl.dataset && cfgEl.dataset.clubName ? cfgEl.dataset.clubName : '';
    const cfgClubLogo = cfgEl && cfgEl.dataset && cfgEl.dataset.clubLogoUrl ? cfgEl.dataset.clubLogoUrl : '';
    const initialClubName = cfgClubName || (typeof getPortalStorage === 'function' ? getPortalStorage('club_name') : null);
    const cachedMeta = (typeof getPortalStorage === 'function') ? getPortalStorage('shared_public_metadata') : null;

    if (cfgClubName || cfgClubLogo) {
      hydrateClubBranding({ clubName: cfgClubName, clubLogoUrl: cfgClubLogo }, 'Schedule');
    } else if (cachedMeta) {
      try {
        hydrateClubBranding(JSON.parse(cachedMeta), 'Schedule');
      } catch (e) {}
    } else if (initialClubName) {
      hydrateClubBranding({ clubName: initialClubName }, 'Schedule');
    }

    const startFetch = () => fetchScheduleData({ isInitialBoot: true });
    if (document.readyState === 'loading') {
      window.addEventListener('DOMContentLoaded', startFetch);
    } else {
      startFetch();
    }
  })();
</script>
