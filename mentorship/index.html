<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Primary SEO & Redirect Metadata -->
    <title>Redirecting to FixtureFlow Mentorship Scheduler...</title>
    <meta name="description" content="Transition from corporate survival to Sage mode. Redirecting to your pro bono 1:1 mentorship booking page.">
    <link rel="canonical" href="https://calendar.app.google/2RQnYGiKLUVUqsD36">
    
    <!-- Instant HTTP Meta Redirect (Pre-script execution) -->
    <meta http-equiv="refresh" content="0; url=https://calendar.app.google/2RQnYGiKLUVUqsD36">
    
    <style>
        :root {
            --bg-app: #08090d;
            --text-primary: #f8fafc;
            --text-muted: #64748b;
            --color-primary: #a78bfa;
        }
        
        body {
            background-color: var(--bg-app);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        
        .redirect-container {
            padding: 40px;
            max-width: 400px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(167, 139, 250, 0.15);
            border-top: 3px solid var(--color-primary);
            border-radius: 50%;
            margin: 0 auto 24px;
            animation: spin 1s linear infinite;
        }
        
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.02em;
        }
        
        p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        
        a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            border-bottom: 1px dashed var(--color-primary);
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="redirect-container">
        <div class="spinner"></div>
        <h1>Redirecting to Scheduler</h1>
        <p>Shifting you from corporate survival to Sage presence...</p>
        <p><small>If you are not redirected automatically, <a href="https://calendar.app.google/2RQnYGiKLUVUqsD36">click here to book your session</a>.</small></p>
    </div>

    <!-- Fast Fallback Javascript Redirect -->
    <script>
        setTimeout(function() {
            window.location.replace("https://calendar.app.google/2RQnYGiKLUVUqsD36");
        }, 100);
    </script>
</body>
</html>
